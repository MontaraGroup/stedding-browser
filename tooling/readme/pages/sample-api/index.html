<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample API — docs</title>
<!-- A page for the README's captures: a second local server, on
     localhost:8797. Nothing here loads from the network. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F4858'/%3E%3Cpath d='M11 10l-5 6 5 6M21 10l5 6-5 6' stroke='%23F2E9DE' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { --slate: #2F4858; --cream: #F2E9DE; --ink: #1C2B33; --line: #DCE3E8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         color: var(--ink); background: #fff; }
  header { background: var(--slate); color: var(--cream); padding: 18px 40px; display: flex; gap: 12px;
           align-items: baseline; }
  header h1 { margin: 0; font-size: 18px; }
  header span { opacity: .75; font: 13px ui-monospace, Menlo, monospace; }
  main { display: grid; grid-template-columns: 220px 1fr; max-width: 1040px; margin: 0 auto; }
  nav { padding: 28px 24px; border-right: 1px solid var(--line); font-size: 14px; }
  nav a { display: block; color: var(--slate); text-decoration: none; padding: 5px 0; }
  article { padding: 28px 40px; }
  h2 { margin: 0 0 6px; font-size: 22px; }
  .verb { display: inline-block; font: 700 12px/1 ui-monospace, Menlo, monospace; color: #fff;
          background: #3E7C5A; padding: 5px 8px; border-radius: 6px; margin-right: 8px; }
  code, pre { font: 13px/1.6 ui-monospace, Menlo, monospace; }
  pre { background: #F5F7F9; border: 1px solid var(--line); border-radius: 10px; padding: 16px; overflow: auto; }
</style>
</head>
<body>
<header><h1>Sample API</h1><span>localhost:8797 · v0.1</span></header>
<main>
  <nav>
    <a href="#items">Items</a>
    <a href="#users">Users</a>
    <a href="#errors">Errors</a>
  </nav>
  <article>
    <h2 id="items">Items</h2>
    <p><span class="verb">GET</span><code>/api/items</code></p>
    <p>Lists the items, newest first. Pages of fifty.</p>
    <pre>{
  "items": [
    { "id": 41, "title": "First draft", "done": false },
    { "id": 40, "title": "Read the notes", "done": true }
  ],
  "next": "/api/items?page=2"
}</pre>
  </article>
</main>
</body>
</html>
